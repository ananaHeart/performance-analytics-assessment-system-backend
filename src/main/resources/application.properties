spring.application.name=assessment
server.port=${PORT:8080}

# Capstone demo simplification: activating the v3 profile always brings in
# v3-mobile-release too, so mobile write APIs work without a second profile
# name or extra env vars. (spring.profiles.include/active can't be set from
# inside a profile-specific file like application-v3.properties itself -
# that's what a profile GROUP is for, and it must live in this base file.)
spring.profiles.group.v3=v3-mobile-release

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${LOCAL_DATASOURCE_URL:jdbc:mysql://localhost:3306/performance_assessment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${LOCAL_DATASOURCE_USERNAME:root}
spring.datasource.password=${LOCAL_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
