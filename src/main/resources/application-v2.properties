spring.config.activate.on-profile=v2

server.port=${V2_PORT:8081}
spring.devtools.livereload.enabled=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${V2_DATASOURCE_URL:jdbc:mysql://localhost:3306/performance_assessment_v2_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${V2_DATASOURCE_USERNAME:root}
spring.datasource.password=${V2_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never

app.v2.auth.session-ttl=PT8H
app.v2.auth.max-failed-attempts=5
app.v2.auth.lock-duration=PT15M
