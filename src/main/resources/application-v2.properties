spring.config.activate.on-profile=v2

server.port=${V2_PORT:8080}
spring.devtools.livereload.enabled=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${V2_DATASOURCE_URL:jdbc:mysql://localhost:3306/performance_assessment_v2_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${V2_DATASOURCE_USERNAME:root}
spring.datasource.password=${V2_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never

app.v2.auth.session-ttl=PT8H
app.v2.auth.max-failed-attempts=5
app.v2.auth.lock-duration=PT15M

app.v2.analytics.maintain-threshold=${V2_ANALYTICS_MAINTAIN_THRESHOLD:80}
app.v2.analytics.review-threshold=${V2_ANALYTICS_REVIEW_THRESHOLD:60}
app.v2.analytics.reteach-threshold=${V2_ANALYTICS_RETEACH_THRESHOLD:40}
app.v2.analytics.easy-item-threshold=${V2_ANALYTICS_EASY_ITEM_THRESHOLD:80}
app.v2.analytics.moderate-item-threshold=${V2_ANALYTICS_MODERATE_ITEM_THRESHOLD:50}

app.v2.email-verification.otp-ttl=${V2_EMAIL_OTP_TTL:PT10M}
app.v2.email-verification.resend-cooldown=${V2_EMAIL_RESEND_COOLDOWN:PT1M}
app.v2.email-verification.max-attempts=${V2_EMAIL_MAX_ATTEMPTS:5}
app.v2.email-verification.delivery-mode=${V2_EMAIL_DELIVERY_MODE:log}
app.v2.email-verification.from-address=${V2_EMAIL_FROM_ADDRESS:no-reply@smart-assessment.local}

spring.mail.host=${V2_SMTP_HOST:}
spring.mail.port=${V2_SMTP_PORT:587}
spring.mail.username=${V2_SMTP_USERNAME:}
spring.mail.password=${V2_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${V2_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${V2_SMTP_STARTTLS:true}
