spring.config.activate.on-profile=v3

server.port=8080
spring.devtools.livereload.enabled=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${V3_DATASOURCE_URL:jdbc:mysql://localhost:3306/performance_assessment_v3_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${V3_DATASOURCE_USERNAME:root}
spring.datasource.password=${V3_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.v3.baseline.expected-database=${V3_EXPECTED_DATABASE:performance_assessment_v3_db}
app.v3.baseline.expected-table-count=${V3_EXPECTED_TABLE_COUNT:67}
app.v3.baseline.expected-foreign-key-count=${V3_EXPECTED_FOREIGN_KEY_COUNT:163}
app.v3.baseline.expected-check-constraint-count=${V3_EXPECTED_CHECK_CONSTRAINT_COUNT:87}
app.v3.baseline.expected-unique-constraint-count=${V3_EXPECTED_UNIQUE_CONSTRAINT_COUNT:99}
app.v3.baseline.expected-dynamic-table-count=${V3_EXPECTED_DYNAMIC_TABLE_COUNT:6}
app.v3.baseline.expected-hardening-column-count=${V3_EXPECTED_HARDENING_COLUMN_COUNT:16}
app.v3.baseline.expected-hardening-constraint-count=${V3_EXPECTED_HARDENING_CONSTRAINT_COUNT:15}
app.v3.baseline.expected-school-scoped-section-rule-count=${V3_EXPECTED_SCHOOL_SCOPED_SECTION_RULE_COUNT:3}
app.v3.baseline.expected-academic-calendar-column-count=${V3_EXPECTED_ACADEMIC_CALENDAR_COLUMN_COUNT:20}
app.v3.baseline.expected-academic-calendar-constraint-count=${V3_EXPECTED_ACADEMIC_CALENDAR_CONSTRAINT_COUNT:16}
app.v3.baseline.expected-paper-size-count=${V3_EXPECTED_PAPER_SIZE_COUNT:3}
app.v3.baseline.expected-paper-size-seed-count=${V3_EXPECTED_PAPER_SIZE_SEED_COUNT:3}
app.v3.baseline.expected-validated-template-region-count=${V3_EXPECTED_VALIDATED_TEMPLATE_REGION_COUNT:15}
app.v3.baseline.expected-question-type-count=${V3_EXPECTED_QUESTION_TYPE_COUNT:5}
app.v3.baseline.expected-omr-template-count=${V3_EXPECTED_OMR_TEMPLATE_COUNT:1}
app.v3.baseline.expected-approved-omr-template-count=${V3_EXPECTED_APPROVED_OMR_TEMPLATE_COUNT:1}
app.v3.baseline.expected-unapproved-omr-template-count=${V3_EXPECTED_UNAPPROVED_OMR_TEMPLATE_COUNT:0}
app.v3.baseline.expected-performance-rule-set-count=${V3_EXPECTED_PERFORMANCE_RULE_SET_COUNT:4}
app.v3.baseline.validate-on-startup=${V3_VALIDATE_ON_STARTUP:true}

app.v3.answer-sheets.storage-directory=${V3_ANSWER_SHEET_STORAGE_DIRECTORY:output/v3-answer-sheets}
app.v3.scan-evidence.storage-directory=${V3_SCAN_EVIDENCE_STORAGE_DIRECTORY:output/v3-scan-evidence}
app.v3.mobile.scan-recovery-enabled=${V3_SCAN_RECOVERY_ENABLED:false}
app.v3.mobile.scan-recovery-delay-ms=${V3_SCAN_RECOVERY_DELAY_MS:60000}

app.v3.calendar.automation-enabled=${V3_CALENDAR_AUTOMATION_ENABLED:false}
app.v3.calendar.automation-cron=${V3_CALENDAR_AUTOMATION_CRON:0 * * * * *}

app.v3.auth.session-ttl=${V3_SESSION_TTL:8h}
app.v3.auth.max-failed-attempts=${V3_MAX_FAILED_ATTEMPTS:5}
app.v3.auth.lock-duration=${V3_LOCK_DURATION:15m}
app.v3.auth.otp-ttl=${V3_OTP_TTL:10m}
app.v3.auth.resend-cooldown=${V3_OTP_RESEND_COOLDOWN:1m}
app.v3.auth.max-otp-attempts=${V3_MAX_OTP_ATTEMPTS:5}
app.v3.auth.max-verification-messages-per-day=${V3_MAX_VERIFICATION_MESSAGES_PER_DAY:5}
app.v3.auth.registration-retention=${V3_REGISTRATION_RETENTION:30d}
app.v3.auth.cleanup-batch-size=${V3_REGISTRATION_CLEANUP_BATCH_SIZE:100}
app.v3.auth.cleanup-enabled=${V3_REGISTRATION_CLEANUP_ENABLED:true}
app.v3.auth.cleanup-cron=${V3_REGISTRATION_CLEANUP_CRON:0 15 2 * * *}
app.v3.auth.email-delivery-mode=${V3_EMAIL_DELIVERY_MODE:log}
app.v3.auth.email-from-address=${V3_EMAIL_FROM_ADDRESS:no-reply@smart-assessment.local}

app.v3.auth.mfa.enabled=${V3_MFA_ENABLED:true}
app.v3.auth.mfa.issuer=${V3_MFA_ISSUER:SMART Assessment}
app.v3.auth.mfa.challenge-ttl=${V3_MFA_CHALLENGE_TTL:5m}
app.v3.auth.mfa.max-attempts=${V3_MFA_MAX_ATTEMPTS:5}
app.v3.auth.mfa.recovery-code-count=${V3_MFA_RECOVERY_CODE_COUNT:10}
app.v3.auth.mfa.verification-window=${V3_MFA_VERIFICATION_WINDOW:1}
app.v3.auth.mfa.secret-key-version=${V3_MFA_SECRET_KEY_VERSION:1}
app.v3.auth.mfa.qr-code-size=${V3_MFA_QR_CODE_SIZE:240}
app.v3.auth.mfa.encryption-key=${V3_MFA_ENCRYPTION_KEY:}

spring.mail.host=${V3_SMTP_HOST:}
spring.mail.port=${V3_SMTP_PORT:587}
spring.mail.username=${V3_SMTP_USERNAME:}
spring.mail.password=${V3_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${V3_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${V3_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${V3_SMTP_STARTTLS_REQUIRED:true}
spring.mail.test-connection=false

# Requires reviewed V3_015..V3_018 deployment and Mobile release acceptance; default remains gated.
app.v3.mobile.finalization-enabled=${V3_MOBILE_FINALIZATION_ENABLED:false}
app.v3.mobile.readback-enabled=${V3_MOBILE_READBACK_ENABLED:false}
app.v3.mobile.evaluation-reference-enabled=${V3_MOBILE_EVALUATION_REFERENCE_ENABLED:false}
app.v3.mobile.reopen-enabled=${V3_MOBILE_REOPEN_ENABLED:false}
app.v3.mobile.correction-enabled=${V3_MOBILE_CORRECTION_ENABLED:false}

app.v3.mobile.supersede-enabled=${V3_MOBILE_SUPERSEDE_ENABLED:false}
