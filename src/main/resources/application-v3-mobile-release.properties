spring.config.activate.on-profile=v3-mobile-release

# Release schema after reviewed V3_015..V3_023 deployment.
app.v3.baseline.expected-table-count=${V3_EXPECTED_TABLE_COUNT:79}
app.v3.baseline.expected-foreign-key-count=${V3_EXPECTED_FOREIGN_KEY_COUNT:200}
app.v3.baseline.expected-check-constraint-count=${V3_EXPECTED_CHECK_CONSTRAINT_COUNT:131}
app.v3.baseline.expected-unique-constraint-count=${V3_EXPECTED_UNIQUE_CONSTRAINT_COUNT:118}
app.v3.baseline.validate-on-startup=true

# The profile alone does not open Mobile writes. Set the master switch only after preflight inputs are ready.
app.v3.mobile.release.profile-enabled=true
app.v3.mobile.release.http-enabled=${V3_MOBILE_HTTP_ENABLED:false}
app.v3.mobile.release.mode=${V3_MOBILE_RELEASE_MODE:development}
app.v3.mobile.release.public-base-url=${V3_MOBILE_PUBLIC_BASE_URL:}
app.v3.mobile.release.contract-pack=1.11.0
app.v3.mobile.release.adb-reverse-enabled=${V3_ADB_REVERSE_ENABLED:false}
app.v3.mobile.release.mobile-wiring-verified=${V3_MOBILE_WIRING_VERIFIED:false}
app.v3.mobile.release.physical-scanner-verified=${V3_PHYSICAL_SCANNER_VERIFIED:false}

app.v3.scan-evidence.storage-directory=${V3_SCAN_EVIDENCE_STORAGE_DIRECTORY:}
app.v3.mobile.scan-recovery-enabled=${V3_SCAN_RECOVERY_ENABLED:false}
app.v3.mobile.finalization-enabled=${V3_MOBILE_FINALIZATION_ENABLED:false}
app.v3.mobile.readback-enabled=${V3_MOBILE_READBACK_ENABLED:false}
app.v3.mobile.evaluation-reference-enabled=${V3_MOBILE_EVALUATION_REFERENCE_ENABLED:false}
app.v3.mobile.reopen-enabled=${V3_MOBILE_REOPEN_ENABLED:false}
app.v3.mobile.correction-enabled=${V3_MOBILE_CORRECTION_ENABLED:false}
app.v3.mobile.supersede-enabled=${V3_MOBILE_SUPERSEDE_ENABLED:false}

server.forward-headers-strategy=framework

# Match the existing 15 MiB evidence contract; allow room for multipart metadata.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
