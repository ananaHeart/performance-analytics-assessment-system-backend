# Opt-in cloud overlay. Activate last: v3,v3-mobile-release,v3-cloud.
# Existing local v3 and tidb profiles are unchanged. No fallback to a local database.
spring.config.activate.on-profile=v3-cloud
server.port=${PORT:8080}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/performance_assessment_v3_test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
spring.datasource.username=${V3_CLOUD_DB_USERNAME}
spring.datasource.password=${V3_CLOUD_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Full release baseline retained. A partial CHECK repair must NOT make startup pass.
app.v3.baseline.database-engine=TIDB
app.v3.baseline.expected-database=performance_assessment_v3_test
app.v3.baseline.expected-table-count=79
app.v3.baseline.expected-foreign-key-count=200
app.v3.baseline.expected-check-constraint-count=131
app.v3.baseline.expected-unique-constraint-count=118
app.v3.baseline.expected-hardening-constraint-count=15
app.v3.baseline.expected-academic-calendar-constraint-count=16
app.v3.baseline.validate-on-startup=true

app.v3.answer-sheets.storage-directory=${V3_CLOUD_STORAGE_ROOT}/answer-sheets
app.v3.scan-evidence.storage-directory=${V3_CLOUD_STORAGE_ROOT}/scan-evidence
# true on Render Free (no persistent disk): a file wiped by a restart is accepted on its
# committed upload receipt instead of blocking finalization. Same switch as the start script.
app.v3.scan-evidence.temporary-storage=${V3_CLOUD_TEMPORARY_STORAGE:false}
# One or more comma-separated web origins: public https origins, plus optionally
# http://localhost:<port> while testing the web app locally against this backend.
app.v3.cloud.frontend-origin=${V3_CLOUD_FRONTEND_ORIGIN}
app.v3.mobile.release.mode=production
app.v3.mobile.release.public-base-url=${V3_CLOUD_PUBLIC_BASE_URL}
app.v3.mobile.release.adb-reverse-enabled=false
# Actual device acceptance remains pending until it is performed.
app.v3.mobile.release.mobile-wiring-verified=false
app.v3.mobile.release.physical-scanner-verified=false

# brevo-api (default) sends over HTTPS and works on Render Free, which blocks outbound SMTP.
# Use smtp only on a host that allows ports 25/465/587; it then needs the V3_CLOUD_SMTP_* values.
app.v3.auth.email-delivery-mode=${V3_CLOUD_EMAIL_MODE:brevo-api}
app.v3.auth.brevo-api-key=${V3_CLOUD_BREVO_API_KEY:}
app.v3.auth.email-from-address=${V3_CLOUD_EMAIL_FROM}
app.v3.auth.mfa.encryption-key=${V3_CLOUD_MFA_ENCRYPTION_KEY}
spring.mail.host=${V3_CLOUD_SMTP_HOST:}
spring.mail.port=${V3_CLOUD_SMTP_PORT:587}
spring.mail.username=${V3_CLOUD_SMTP_USERNAME:}
spring.mail.password=${V3_CLOUD_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
